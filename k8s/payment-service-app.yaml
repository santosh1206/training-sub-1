apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: app-ns-2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      nodeSelector:
        agentpool: userpool # Pins pods strictly to User Node Pool
      tolerations:
        - key: "workload"
          operator: "Equal"
          value: "apps"
          effect: "NoSchedule"
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway # Allows scheduling on 1 node now, spreads across nodes when scaled
          labelSelector:
            matchLabels:
              app: payment-service
      containers:
        - name: payment-api
          image: mcr.microsoft.com/azuredocs/aks-helloworld:v2
          env:
            - name: TITLE
              value: "Payment Service - Namespace 2 (app-ns-2)"
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: app-ns-2
spec:
  type: ClusterIP
  selector:
    app: payment-service
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: payment-ingress
  namespace: app-ns-2
spec:
  ingressClassName: nginx
  rules:
    - host: app2.internal.corp
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: payment-service
                port:
                  number: 80